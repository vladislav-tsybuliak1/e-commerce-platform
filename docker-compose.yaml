services:
  e_commerce_platform_backend:
    build:
      context: ./backend
    env_file:
      - ./backend/src/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: always
    command: >
      sh -c "cd src &&
            poetry run alembic upgrade head &&
            poetry run python main.py"
    depends_on:
      - db

  e_commerce_platform_frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - e_commerce_platform_backend
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "8080:8080"

  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - ./backend/src/.env
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data


volumes:
  data:
  node_modules:
